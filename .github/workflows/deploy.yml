
name: Deploy Outbox Labs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build frontend
        working-directory: outbox-labs-scheduled-email/frontend
        run: |
          npm install
          npm run build -- --base=/Outbox_Labs_Scheduled_Email_Project/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: outbox-labs-scheduled-email/frontend/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
